<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Culto</title>

  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      height: 300px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
    }

    .song {
      background: #1e293b;
      padding: 10px;
      margin: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .song.selected {
      background: #22c55e;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }

    .input-box {
      padding: 10px;
      border-radius: 10px;
      border: none;
    }

    .sticky-footer {
      position: sticky;
      bottom: 0;
      background: #0f172a;
      padding: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
  </style>
</head>

<body>

  <h1>🎶 Generador de Culto <small style="font-size: 0.5em;">Versión 4.1.8</small></h1>

  <!-- 🔐 PASSWORD -->
  <input type="password" id="adminPass" class="input-box" placeholder="Contraseña admin" autocomplete="off">

  <input type="text" id="buscador" class="input-box" placeholder="Buscar canción..." oninput="filtrarCanciones()"
    style="width:80%; margin:10px;" autocomplete="off">

  <br>

  <select onchange="ordenarCanciones(this.value)" class="input-box" aria-label="Ordenar canciones">
    <option value="default">Ordenar</option>
    <option value="az">A-Z</option>
    <option value="za">Z-A</option>
    <option value="numAsc">Número ↑</option>
    <option value="numDesc">Número ↓</option>
  </select>

  <div class="container" id="songList"></div>

  <div class="sticky-footer">
    <select id="formatoPPT" aria-label="Formato de presentación"
      style="padding: 8px 12px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid #334155; font-weight: bold; cursor: pointer;">
      <option value="presencial">Presencial</option>
      <option value="facebook">Facebook</option>
      <option value="ambas">Ambas</option>
    </select>
    <button onclick="generarPPT()" style="background:#16a34a;">🎞️ Generar PPT</button>
    <button onclick="preview()" style="background:#2563eb;">👁️ Preview</button>
    <button onclick="limpiarSeleccion()" style="background:#ca8a04;">🧹 Limpiar</button>
    <button onclick="mostrarEliminar()" style="background:#dc2626;">🗑️ Eliminar</button>
    <button onclick="abrirEditorAdmin()" style="background:#7c3aed;">✏️ Editar canción</button>
  </div>

  <div id="seleccionadasUI" style="margin:10px;"></div>
  <div id="previewContainer" style="max-width:800px; margin:auto;"></div>

  <!-- 🗑️ UI ELIMINAR -->
  <div id="eliminarUI" style="display:none; margin:20px;"></div>

  <hr>

  <h3>Subir desde archivo (PDF o PPTX)</h3>
  <input type="file" id="fileInput" accept=".pdf,.pptx" aria-label="Seleccionar archivo PDF o PPTX">
  <button onclick="subirArchivo()">Subir archivo</button>

  <!-- 👁️ MODAL PREVIEW -->
  <div id="previewModal" style="
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.85);
  z-index:9998;
  overflow:auto;
  padding:30px 20px;
  box-sizing:border-box;
">
    <div style="
    max-width:860px;
    margin:auto;
    position:relative;
  ">
      <!-- Cabecera fija del modal -->
      <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#1e293b;
      border-radius:14px 14px 0 0;
      padding:16px 24px;
      position:sticky;
      top:0;
      z-index:10;
      border-bottom:2px solid #334155;
    ">
        <h2 style="margin:0; color:#f8fafc; font-size:18px;">&#x1F3B5; Vista previa del culto</h2>
        <button onclick="cerrarPreview()" style="
        background:#ef4444;
        border-radius:50%;
        width:36px; height:36px;
        font-size:18px;
        padding:0;
        flex-shrink:0;
      ">✕</button>
      </div>

      <!-- Contenido del preview -->
      <div id="previewContenido" style="
      background:#0f172a;
      border-radius:0 0 14px 14px;
      padding:30px;
    "></div>
    </div>
  </div>

  <!-- ✏️ MODAL EDITOR TIPO WORD -->
  <div id="editorModal" style="
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.7);
  z-index:9999;
  overflow:auto;
  padding:30px;
  box-sizing:border-box;
">
    <div style="
    background:#1e293b;
    border-radius:16px;
    max-width:850px;
    margin:auto;
    padding:30px;
    position:relative;
  ">
      <button onclick="cerrarEditor()" style="
      position:absolute;
      top:15px; right:15px;
      background:#ef4444;
      border-radius:50%;
      width:36px; height:36px;
      font-size:18px;
      padding:0;
    ">✕</button>

      <h2 style="margin-top:0; color:#a78bfa;">✏️ Editor de Canciones</h2>

      <!-- Contenido editor -->
      <div id="editorContenido">

        <!-- Buscador -->
        <p style="color:#94a3b8; margin-bottom:5px;">Busca la canción a editar:</p>
        <input type="text" id="editorBuscador" placeholder="Escribe el nombre..." oninput="filtrarEditorLista()" style="
        width:100%; padding:10px; border-radius:10px;
        border:none; background:#0f172a; color:white;
        margin-bottom:10px; box-sizing:border-box;
      ">
        <div id="editorListaCanciones" style="
        max-height:200px; overflow-y:auto;
        background:#0f172a; border-radius:10px;
        margin-bottom:15px;
      "></div>

        <!-- Área tipo Word -->
        <div id="editorWordArea" style="display:none;">
          <p style="color:#a78bfa; font-size:14px; margin-bottom:5px;">Editando: <strong
              id="editorTituloLabel"></strong></p>
          <p style="color:#64748b; font-size:12px; margin-bottom:8px;">💡 Edita la letra directamente. Usa "---" (tres
            guiones) en una línea nueva para separar slides.</p>
          <div id="editorTextoWord" contenteditable="true" style="
          background:white;
          color:#111;
          padding:30px;
          border-radius:10px;
          font-family:'Georgia', serif;
          font-size:15px;
          line-height:1.7;
          min-height:350px;
          max-height:500px;
          overflow-y:auto;
          outline:none;
          white-space:pre-wrap;
          box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        "></div>
          <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
            <button onclick="cancelarEdicionWord()" style="background:#64748b;">Cancelar</button>
            <button onclick="guardarEdicionWord()" style="background:#22c55e; font-size:15px; padding:12px 24px;">💾
              Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>
  </div>

    const cancionesLocales = [
      {
        titulo: "Dios de lo imposible",
        slides: [
          "DIOS DE LO IMPOSIBLE\nJesucristo, reinas con poder\nSoberano, victorioso rey\nNi la muerte pudo detener\nTu poder para vencer",

    let canciones = [];

    // 🔥 FETCH ROBUSTO (URL relativa, funciona local y en Render)
    async function cargarCancionesDesdeBackend() {
      try {
        // URL relativa: funciona en local Y en Render sin hardcodear
        let res = await fetch("/canciones?t=" + Date.now());

        if (!res.ok) throw new Error("Error backend");

        return await res.json();

      } catch (err) {
        console.error("Error cargando canciones:", err);
        return [];
      }
    }

    async function iniciarApp() {
      seleccionadas = [];
      document.getElementById("buscador").value = "";

      const data = await cargarCancionesDesdeBackend();

      canciones = [...cancionesLocales, ...data];
      cancionesFiltradas = [...canciones];

      mostrarCanciones();
    }

    function mostrarCanciones() {
      const contenedor = document.getElementById("songList");
      contenedor.innerHTML = "";

      cancionesFiltradas.forEach(c => {
        const div = document.createElement("div");
        div.classList.add("song");
        div.innerText = c.titulo;

        const realIndex = canciones.indexOf(c);

        if (seleccionadas.includes(realIndex)) {
          div.classList.add("selected");
        }

        div.onclick = () => {
          if (seleccionadas.includes(realIndex)) {
            seleccionadas = seleccionadas.filter(i => i !== realIndex);
          } else {
            seleccionadas.push(realIndex);
          }

          actualizarSeleccionUI();
          mostrarCanciones();
        };

        contenedor.appendChild(div);
      });
    }

    function actualizarSeleccionUI() {
      const cont = document.getElementById("seleccionadasUI");

      cont.innerHTML = seleccionadas.length === 0
        ? "No hay canciones seleccionadas"
        : seleccionadas.map(i => canciones[i]?.titulo).join(" ➜ ");
    }

    function limpiarSeleccion() {
      seleccionadas = [];
      actualizarSeleccionUI();
      mostrarCanciones();
    }

    function filtrarCanciones() {
      let texto = document.getElementById("buscador").value.toLowerCase();
      cancionesFiltradas = canciones.filter(c => c.titulo.toLowerCase().includes(texto));
      mostrarCanciones();
    }

    function ordenarCanciones(tipo) {
      let copia = [...cancionesFiltradas];

      if (tipo === "az") copia.sort((a, b) => a.titulo.localeCompare(b.titulo));
      if (tipo === "za") copia.sort((a, b) => b.titulo.localeCompare(a.titulo));
      if (tipo === "numAsc") copia.sort((a, b) => extraerNumero(a.titulo) - extraerNumero(b.titulo));
      if (tipo === "numDesc") copia.sort((a, b) => extraerNumero(b.titulo) - extraerNumero(a.titulo));

      cancionesFiltradas = copia;
      mostrarCanciones();
    }

    function extraerNumero(texto) {
      let m = texto.match(/\d+/);
      return m ? parseInt(m[0]) : 9999;
    }

    // ════════════════════════════════
    //  PREVIEW - Vista previa del culto
    // ════════════════════════════════
    function preview() {
      if (seleccionadas.length === 0) {
        alert("Selecciona al menos una canción primero.");
        return;
      }

      const contenedor = document.getElementById("previewContenido");
      const colores = [
        "#7c3aed", "#0891b2", "#059669", "#d97706",
        "#db2777", "#2563eb", "#65a30d", "#9333ea"
      ];

      let html = "";

      seleccionadas.forEach((idx, numeroCancion) => {
        const cancion = canciones[idx];
        if (!cancion) return;

        const color = colores[numeroCancion % colores.length];

        // Encabezado de la canción
        html += `
      <div style="margin-bottom:36px;">
        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          margin-bottom:16px;
        ">
          <div style="
            background:${color};
            color:white;
            font-weight:bold;
            font-size:13px;
            border-radius:50%;
            width:30px; height:30px;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
          ">${numeroCancion + 1}</div>
          <h3 style="
            margin:0;
            color:#f1f5f9;
            font-size:20px;
            font-family:'Georgia', serif;
            border-bottom:2px solid ${color};
            padding-bottom:6px;
            flex:1;
          ">${cancion.titulo}</h3>
        </div>
    `;

        // Slides de la canción
        if (cancion.slides && cancion.slides.length > 0) {
          cancion.slides.forEach((slide, i) => {
            html += `
          <div style="
            background:#1e293b;
            border-left:4px solid ${color};
            border-radius:0 10px 10px 0;
            padding:16px 20px;
            margin-bottom:10px;
            font-family:'Georgia', serif;
            font-size:15px;
            line-height:1.8;
            color:#e2e8f0;
            white-space:pre-wrap;
          "><span style="
            color:${color};
            font-size:11px;
            font-family:sans-serif;
            font-weight:bold;
            display:block;
            margin-bottom:6px;
            text-transform:uppercase;
            letter-spacing:1px;
          ">Slide ${i + 1}</span>${slide}</div>
        `;
          });
        } else {
          html += `<p style="color:#64748b; font-style:italic;">Sin slides disponibles</p>`;
        }

        html += `</div>`;

        // Separador entre canciones (excepto la última)
        if (numeroCancion < seleccionadas.length - 1) {
          html += `<hr style="border:none; border-top:1px dashed #334155; margin:10px 0 30px;">`;
        }
      });

      contenedor.innerHTML = html;
      document.getElementById("previewModal").style.display = "block";
      // Scroll al inicio
      document.getElementById("previewModal").scrollTop = 0;
    }

    function cerrarPreview() {
      document.getElementById("previewModal").style.display = "none";
    }

    // 🔥 SUBIR CON PASSWORD + REEMPLAZO
    async function subirArchivo() {

      let password = document.getElementById("adminPass").value;
      if (!password) return alert("Ingresa contraseña admin");

      let file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Selecciona un archivo");

      const tituloArchivo = file.name.replace(/\.[^.]+$/, ""); // sin extensión
      const existe = canciones.some(c => c.titulo.toLowerCase() === tituloArchivo.toLowerCase());

      let replace = false;
      if (existe) {
        replace = confirm("Ya existe una canción con ese nombre. ¿Deseas reemplazarla?");
        if (!replace) return;
      }

      let formData = new FormData();
      formData.append("archivo", file);
      formData.append("password", password);
      formData.append("replace", replace);

      let btn = event.target;
      btn.textContent = "⏳ Subiendo...";
      btn.disabled = true;

      try {
        let res = await fetch("/upload", { method: "POST", body: formData });
        let data = await res.json();

        if (!res.ok) {
          alert("Error: " + data.error);
        } else {
          const msg = [];
          if (data.added && data.added.length) msg.push("✅ Añadida: " + data.added.join(", "));
          if (data.replaced && data.replaced.length) msg.push("🔄 Reemplazada: " + data.replaced.join(", "));
          if (data.skipped && data.skipped.length) msg.push("⏭️ Omitida (ya existe): " + data.skipped.join(", "));
          if (data.errors && data.errors.length) msg.push("❌ Error en: " + data.errors.join(", "));
          alert(msg.length ? msg.join("\n") : "✅ Proceso completado");
          document.getElementById("fileInput").value = "";
          await iniciarApp();
        }
      } catch (e) {
        alert("Error de conexión: " + e.message);
      } finally {
        btn.textContent = "Subir archivo";
        btn.disabled = false;
      }
    }

    // 🔥 ELIMINAR
    function mostrarEliminar() {

      const cont = document.getElementById("eliminarUI");

      // 🔁 TOGGLE (mostrar / ocultar)
      if (cont.style.display === "block") {
        cont.style.display = "none";
        cont.innerHTML = "";
        return;
      }

      cont.style.display = "block";

      cont.innerHTML = `
    <input 
      type="text" 
      id="buscadorEliminar" 
      placeholder="Buscar canción a eliminar..."
      oninput="filtrarEliminar()"
      style="padding:10px; width:80%; border-radius:10px; border:none; margin:10px;"
    >
    <div id="listaEliminar"></div>
  `;
    }
    function filtrarEliminar() {

      const texto = document.getElementById("buscadorEliminar").value.toLowerCase();
      const lista = document.getElementById("listaEliminar");

      const filtradas = canciones.filter(c =>
        c.titulo.toLowerCase().includes(texto)
      );

      if (filtradas.length === 0) {
        lista.innerHTML = "<p>No se encontraron canciones</p>";
        return;
      }

      lista.innerHTML = filtradas.map(c => `
    <div style="
      background:#1e293b;
      margin:5px;
      padding:10px;
      border-radius:10px;
    ">
      ${c.titulo}
      <br>
      <button onclick="eliminarCancion('${c.id}')" style="background:#ef4444; margin-top:5px;">Eliminar</button>
    </div>
  `).join("");
    }

    async function eliminarCancion(id) {

      let password = document.getElementById("adminPass").value;
      if (!password) return alert("Ingresa contraseña");

      let ok = confirm("¿Eliminar?");
      if (!ok) return;

      let res = await fetch("/eliminar/" + id, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      let data = await res.json();

      if (!res.ok) return alert(data.error);

      alert("Eliminado");
      iniciarApp();
    }

    // 🔥 MÚLTIPLES FORMATOS DE PPT
    function generarPPT() {
      if (seleccionadas.length === 0) {
        alert("Por favor, selecciona al menos una canción.");
        return;
      }

      const formato = document.getElementById("formatoPPT").value;

      if (formato === "presencial" || formato === "ambas") {
        generarPPTPresencial(formato === "ambas" ? "culto_presencial.pptx" : "culto.pptx");
      }

      if (formato === "facebook" || formato === "ambas") {
        generarPPTFacebook(formato === "ambas" ? "culto_facebook.pptx" : "culto.pptx");
      }
    }

    // 🔥 PPT FACEBOOK (ARIAL BLACK BLANCA)
    function generarPPTFacebook(fileName) {
      let pptx = new PptxGenJS();
      pptx.defineLayout({ name: "CUSTOM", width: 20, height: 11.25 });
      pptx.layout = "CUSTOM";

      let inicio = pptx.addSlide();
      inicio.addImage({ data: intermedioFacebook, x: 0, y: 0, w: 20, h: 11.25 });

      seleccionadas.map(i => canciones[i]).forEach(c => {

        c.slides.forEach((texto, index) => {

          let lineas = texto.split("\n");

          // Formato Facebook: Arial Black, Blanco. Más elevado o centrado según lo extraído del PPTX
          if (index === 0) {
            // 1. El título ocupa toda una diapositiva solo
            let slideTitulo = pptx.addSlide();
            slideTitulo.addImage({ data: plantillaFacebook, x: 0, y: 0, w: 20, h: 11.25 });
            slideTitulo.addText(lineas[0], {
              x: 4, y: 8.8, w: 15, h: 2.0, align: "center", valign: "middle", fontFace: "Arial Black", fontSize: 60, color: "FFFFFF"
            });

            // 2. El resto de las líneas de la primera diapositiva se divide de 2 en 2
            let lineasRestantes = lineas.slice(1).filter(l => l.trim() !== "");
            for (let j = 0; j < lineasRestantes.length; j += 2) {
              let chunk = lineasRestantes.slice(j, j + 2).join("\n");
              let slide = pptx.addSlide();
              slide.addImage({ data: plantillaFacebook, x: 0, y: 0, w: 20, h: 11.25 });
              slide.addText(chunk, {
                x: 4, y: 8.8, w: 15, h: 2.0, align: "center", valign: "middle", fontFace: "Arial Black", fontSize: 60, color: "FFFFFF"
              });
            }
          } else {
            // 3. Las demás diapositivas se dividen de 2 en 2 líneas
            let lineasLimpias = lineas.filter(l => l.trim() !== "");
            for (let j = 0; j < lineasLimpias.length; j += 2) {
              let chunk = lineasLimpias.slice(j, j + 2).join("\n");
              let slide = pptx.addSlide();
              slide.addImage({ data: plantillaFacebook, x: 0, y: 0, w: 20, h: 11.25 });
              slide.addText(chunk, {
                x: 4, y: 8.8, w: 15, h: 2.0, align: "center", valign: "middle", fontFace: "Arial Black", fontSize: 60, color: "FFFFFF"
              });
            }
          }

        });

        let inter = pptx.addSlide();
        inter.addImage({ data: intermedioFacebook, x: 0, y: 0, w: 20, h: 11.25 });

      });

      pptx.writeFile({ fileName: fileName });
    }

    
    // 🔥 PPT PRESENCIAL (CONSTANTIA FORZADA)
    function generarPPTPresencial(fileName) {
      let pptx = new PptxGenJS();
      pptx.defineLayout({ name: "CUSTOM", width: 20, height: 11.25 });
      pptx.layout = "CUSTOM";

      let inicio = pptx.addSlide();
      inicio.addImage({ data: intermedio, x: 0, y: 0, w: 20, h: 11.25 });

      seleccionadas.map(i => canciones[i]).forEach(c => {

        c.slides.forEach((texto, index) => {

          let slide = pptx.addSlide();
          slide.addImage({ data: plantilla, x: 0, y: 0, w: 20, h: 11.25 });

          let lineas = texto.split("\n");

          if (index === 0) {
            slide.addText([
              { text: lineas[0] + "\n", options: { fontFace: "Constantia", fontSize: 60, bold: true, italic: true, color: "D33D05", align: "center" } },
              { text: lineas.slice(1).join("\n"), options: { fontFace: "Constantia", fontSize: 88, color: "632423", align: "center" } }
            ], { x: 2, y: 2, w: 16, h: 7, align: "center" });
          } else {
            slide.addText(texto, {
              x: 2, y: 2, w: 16, h: 7,
              align: "center",
              fontFace: "Constantia",
              fontSize: 88,
              color: "632423"
            });
          }

        });

        let inter = pptx.addSlide();
        inter.addImage({ data: intermedio, x: 0, y: 0, w: 20, h: 11.25 });

      });

      pptx.writeFile({ fileName: fileName });
    }

    iniciarApp();

    // ===============================
    //  EDITOR TIPO WORD
    // ===============================

    let editorPassOk = false;
    let editorCancionActual = null;

    function abrirEditorAdmin() {
      // Toma la contraseña del campo adminPass que ya existe en la página
      const pass = document.getElementById("adminPass").value;
      if (!pass) {
        alert("Ingresa primero la contraseña de administrador en el campo de arriba.");
        return;
      }
      editorPassOk = pass;
      editorCancionActual = null;
      document.getElementById("editorContenido").style.display = "block";
      document.getElementById("editorWordArea").style.display = "none";
      document.getElementById("editorBuscador").value = "";
      document.getElementById("editorModal").style.display = "block";
      filtrarEditorLista();
    }

    function cerrarEditor() {
      document.getElementById("editorModal").style.display = "none";
      editorCancionActual = null;
    }

    function filtrarEditorLista() {
      const q = document.getElementById("editorBuscador").value.toLowerCase();
      const cont = document.getElementById("editorListaCanciones");
      const filtradas = canciones.filter(c => c.titulo.toLowerCase().includes(q));

      if (filtradas.length === 0) {
        cont.innerHTML = "<p style='color:#64748b; padding:10px;'>No se encontraron canciones</p>";
        return;
      }

      cont.innerHTML = filtradas.map(c => `
    <div onclick="seleccionarCancionEditor('${c.id}')" style="
      padding:10px 14px;
      cursor:pointer;
      border-bottom:1px solid #1e293b;
      color:#e2e8f0;
      transition:background 0.15s;
    "
    onmouseover="this.style.background='#334155'"
    onmouseout="this.style.background='transparent'">
      ${c.titulo}
    </div>
  `).join("");
    }

    function seleccionarCancionEditor(id) {
      const c = canciones.find(x => x.id == id);
      if (!c) return;
      editorCancionActual = c;

      document.getElementById("editorTituloLabel").textContent = c.titulo;
      // Mostramos los slides separados por líneas con "---"
      const textoCompleto = c.slides.join("\n---\n");
      document.getElementById("editorTextoWord").textContent = textoCompleto;
      document.getElementById("editorWordArea").style.display = "block";
      document.getElementById("editorListaCanciones").innerHTML = "";
      document.getElementById("editorBuscador").value = "";
    }

    function cancelarEdicionWord() {
      editorCancionActual = null;
      document.getElementById("editorWordArea").style.display = "none";
      filtrarEditorLista();
    }

    async function guardarEdicionWord() {
      if (!editorCancionActual) return;
      // Lee siempre la contraseña del campo principal de la página
      const password = document.getElementById("adminPass").value || editorPassOk;
      if (!password) return alert("Ingresa la contraseña de administrador en el campo de la página.");

      const textoEditado = document.getElementById("editorTextoWord").innerText;
      const titulo = editorCancionActual.titulo;
      const id = editorCancionActual.id;

      if (!textoEditado.trim()) return alert("El texto no puede estar vacío");

      const btn = document.querySelector("#editorWordArea button[onclick='guardarEdicionWord()']");
      if (btn) { btn.textContent = "⏳ Guardando..."; btn.disabled = true; }

      try {
        const res = await fetch("/editar/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, titulo, texto: textoEditado })
        });
        const data = await res.json();
        if (!res.ok) return alert("Error: " + data.error);
        alert("✅ Canción actualizada con éxito");
        cerrarEditor();
        await iniciarApp();
      } catch (e) {
        alert("Error de conexión: " + e.message);
      } finally {
        if (btn) { btn.textContent = "💾 Guardar cambios"; btn.disabled = false; }
      }
    }

    function cargarParaEditar(id) {
      let c = canciones.find(x => x.id == id);
      if (!c) return;

      document.getElementById("editId").value = c.id;
      document.getElementById("tituloManual").value = c.titulo;
      document.getElementById("textoManual").value = c.slides.join("\n");

      document.getElementById("tituloManual").focus();
      window.scrollTo(0, document.body.scrollHeight);
    }

  </script>
