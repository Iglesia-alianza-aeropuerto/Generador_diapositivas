# Mantiene activo el proyecto de Supabase (el plan gratis se pausa tras 7 días sin actividad).
# Requiere los secrets SUPABASE_URL y SUPABASE_KEY en GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 13 */2 * *"   # cada 2 días, 8:00 a. m. hora Colombia
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla canciones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL / SUPABASE_KEY"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/canciones?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase respondió HTTP $code"
          [ "$code" = "200" ]
